# PR 门禁（map #20）：macOS arm64 原生构建 + audit，以及（可选的）EditMode 测试。
# 完整多平台矩阵在 plugins-matrix.yml（发版 / 定时）。
name: PR

on:
  pull_request:
  push:
    branches: [main]

# 同一分支的新推送取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-macos-arm64:
    name: macOS arm64 plugin + audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 不装 meson：构建入口是 CMake（#27 移除了 Meson —— 它不编译任何源文件，
      # 却带来「改源码不重建」与「--cross-file 零作用」两个缺陷）。
      - name: Install build tools
        run: brew install cmake ninja

      # 刻意不做 `chmod +x`。脚本的可执行位已正确记录在 git 中
      # （本仓库 core.fileMode=false，曾导致模式丢失，见 #35）。
      # 兜底 chmod 会持续掩盖同类回归 —— 这一步就是让它暴露。
      - name: Assert scripts are executable (no chmod fallback)
        run: |
          fail=0
          for s in native/scripts/*.sh native/scripts/*.py; do
            if [[ ! -x "$s" ]]; then
              echo "::error file=$s::缺少可执行位。请用 'git update-index --chmod=+x $s' 修正，不要在 CI 里 chmod。"
              fail=1
            fi
          done
          exit $fail

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      - name: Build plugin (CMake)
        run: ./native/scripts/build-macos-arm64.sh

      # audit 已在构建的 POST_BUILD 阶段跑过一次（stage_plugin.py 内部，check=True），
      # 这里再显式跑一次，是为了在 CI 日志里成为独立可定位的一步。
      - name: Audit plugin (symbols + no forbidden crypto dylibs)
        run: |
          ./native/scripts/audit-macos-plugin.sh \
            Packages/datachannel-unity/Plugins/macOS/arm64/datachannel_unity.bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: datachannel_unity-macos-arm64
          path: Packages/datachannel-unity/Plugins/macOS/arm64/datachannel_unity.bundle

  editmode:
    name: EditMode tests
    # 需要 Unity 许可证。维护者配好下列 secrets 后，把仓库变量
    # ENABLE_UNITY_TESTS 设为 'true' 即可启用（变量可用于 if，secrets 不可）：
    #   UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD
    # 未启用时本 job 显示为 skipped —— 这比注释掉一段死代码好：它是活的、
    # 会随配置自动生效，且在 PR 检查列表里可见。
    if: ${{ vars.ENABLE_UNITY_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: EditMode
          # 原生插件未入库（#35），涉及 native 的用例在 CI 上不可用；
          # 这里只跑纯托管断言。
          customParameters: -assemblyNames DataChannelUnity.Tests.Editor
