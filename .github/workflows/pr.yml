# PR 门禁（map #46 / 决议 #51）。
#
# 跑**工具链形状的代表**，不是所有平台。判据是**新信息量**而不是平台数。
#
#   macOS universal   Mach-O / clang    / nm+otool  / 本机构建
#   Windows x64       PE     / MSVC     / dumpbin   / 本机构建
#   Linux x64         ELF    / gcc      / readelf   / 本机构建
#   Android arm64-v8a ELF    / NDK clang/ readelf   / **交叉编译**
#   iOS arm64         Mach-O / clang    / nm        / **交叉编译 + ld -r 收窄**
#
# **iOS 在这里不是因为它是 Mach-O（macOS 已代表），而是因为 ld -r 符号收窄是
# 本仓库任何平台都没有的全新构建阶段**（决议 #90 §6）。原注「iOS 尚未产出任何
# 产物，仍留给 plugins-matrix.yml」在本图收尾时已不成立，同时改掉。
#
# **Android 在这里不是因为它是 ELF，而是因为它是第一条交叉编译代表**（决议 #79）。
# 早先这里写着「Android 与 Linux 同为 ELF，新信息接近零」—— 那句话只比了「目标
# 格式」一条轴，而 `-DCMAKE_TOOLCHAIN_FILE=` 这条路径本仓库在 Android 之前**从未
# 走过**（SPEC §9）。按同一个判据重算，结论相反。
#
# 另一条同样来自本文件的论证：下面那段说「PR 只跑 mac」被推翻，是因为完整矩阵每周
# 一才跑、最坏坏七天且已攒一堆提交。Android 一旦入库就是已交付平台，它坏七天与
# Linux 坏七天没有区别。
#
# 这推翻了 SPEC §10 的「PR 至少一个 mac 构建 + audit」（原为只跑 mac）：改
# CMakeLists 或 dcu.h 完全可能 mac 绿而 Windows/Linux 红，而完整矩阵每周一才跑，
# 最坏情况坏七天且已攒一堆提交。
name: PR

on:
  pull_request:
  push:
    branches: [main]

# 同一分支的新推送取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-26
            platform: darwin
            artifact_path: Packages/datachannel-unity/Plugins/macOS/datachannel_unity.dylib
            build_info_path: Packages/datachannel-unity/Report~/macOS.json
          - name: Windows x64
            # 钉 windows-2022 而不是 windows-latest：后者现已指向 Windows Server
            # 2025 + **VS 2026**（别名 windows-2025-vs2026），"Visual Studio 17 2022"
            # 这个生成器名字匹配不上，实测报 "could not find any instance of
            # Visual Studio"。而 MSVC 工具集版本决定插件链接的 CRT，本就不该跟着
            # 镜像漂 —— 与 Xcode 钉 26.6 同一个思路（#51）。
            os: windows-2022
            platform: windows
            artifact_path: Packages/datachannel-unity/Plugins/Windows/x86_64/datachannel_unity.dll
            build_info_path: Packages/datachannel-unity/Report~/Windows-x86_64.json
          - name: Linux x64
            # 现存最老的 ubuntu 标签（ubuntu-20.04 已下架）。它决定本包的 glibc
            # 下限 = 2.35，比 Unity 2022.3 声明的 Ubuntu 20.04（2.31）高一档 ——
            # 这是**显式声明**的支持下限，理由见 #51。
            os: ubuntu-22.04
            platform: linux
            artifact_path: Packages/datachannel-unity/Plugins/Linux/x86_64/libdatachannel_unity.so
            build_info_path: Packages/datachannel-unity/Report~/Linux-x86_64.json
          - name: Android arm64-v8a
            # 与 Linux x64 同宿主，但走 NDK 的 toolchain file 交叉编译 ——
            # 本仓库第一条真正使用 -DCMAKE_TOOLCHAIN_FILE= 的路径（决议 #79）。
            os: ubuntu-22.04
            platform: android
            artifact_path: Packages/datachannel-unity/Plugins/Android/arm64-v8a/libdatachannel_unity.so
            build_info_path: Packages/datachannel-unity/Report~/Android-arm64-v8a.json
          - name: iOS arm64
            # macOS 宿主 + iOS toolchain file 交叉编译 ——
            # ld -r 符号收窄是本仓库任何平台都没有的全新构建阶段（决议 #90 §6）。
            os: macos-26
            platform: ios
            artifact_path: Packages/datachannel-unity/Plugins/iOS/libdatachannel_unity.a
            build_info_path: Packages/datachannel-unity/Report~/iOS.json
    defaults:
      run:
        # Windows runner 的默认 shell 是 pwsh。不写这行，下面的 bash 语法会直接
        # 语法错 —— 而「脚本可执行位」那种断言在语法错下是**恒假**，同样违反
        # 「让缺席变成失败，而不是沉默」。见 #48。
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # 钉死 Xcode 版本。托管 mac runner 拿不到「锁工具链」的等价好处（Xcode 装不进
      # Linux 容器），唯一的对策就是显式选版本 —— 用默认的话，GitHub 换镜像时我们的
      # 产物会悄悄变（最低部署目标、链接器行为）。26.6 与本机开发环境同版本。
      - name: Pin Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      # 只从 Ubuntu 官方源更新索引：`sourceparts=/dev/null` 让 apt 跳过整个
      # sources.list.d/，那里装着 runner 镜像预置的第三方源（microsoft、chrome
      # 等）。v0.1.0 那次 release 跑就是被它们弄红的 —— packages.microsoft.com
      # 返回 403，apt-get update 整体 exit 100，而我们一个包都不从那里取。
      #
      # 刻意**不写** `|| true`：那会把「Ubuntu 源也挂了」一起吞掉，正是
      # CONTRIBUTING 第一条点名的病。这里是缩小读取范围，不是忽略失败 ——
      # 官方源取不到索引，这一步照样红。
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Dir::Etc::sourceparts=/dev/null
          sudo apt-get install -y cmake ninja-build

      # 刻意不做 `chmod +x`。但**也不查文件系统的 -x** —— 在 Windows 的 Git Bash 下
      # 那个位是从 shebang 伪造出来的（msys2 无 ACL 时的行为，见 #48），断言会
      # **恒真**，#35 那种模式回归照样绿。查 git 索引里的 mode 才是查到了真东西，
      # 而且全平台行为一致。
      - name: Assert scripts are executable in git (not on disk)
        run: |
          fail=0
          while read -r mode _ _ file; do
            if [[ "$mode" != "100755" ]]; then
              echo "::error file=$file::git index mode is $mode, expected 100755. Fix with 'git update-index --chmod=+x $file'; do not chmod in CI."
              fail=1
            fi
          done < <(git ls-files -s native/scripts/)
          exit $fail

      # NDK 钉 **r27 大版本**，小版本取镜像上最新的（决议 #79）。
      #
      # 不用 $ANDROID_NDK_HOME / $ANDROID_NDK_LATEST_HOME —— 它们指向哪一版会
      # 随镜像更新漂移，而 Android 是唯一一个产物**完全由工具链决定**的平台
      # （其余三个至少有宿主 runner 标签兜着）。理由与上面 Pin Xcode 那步一字不差。
      #
      # 找不到 27.* 就直接红，不回落到默认 NDK：回落会让「钉住了」和「没钉住」
      # 长得一样，而产物会因此悄悄换一个工具链 —— CONTRIBUTING 的第一原则。
      - name: Pin Android NDK (r27, highest minor)
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          ndk_root=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -1 || true)
          if [[ -z "$ndk_root" || ! -d "$ndk_root" ]]; then
            echo "::error::No NDK 27.* under $ANDROID_SDK_ROOT/ndk (decision #79 pins the r27 major)"
            ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "(no ndk directory at all)"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"
          echo "Pinned NDK: $ndk_root"

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      # 产品入口就是 CMake 本身（SPEC §9）。POST_BUILD 会自动暂存并跑 audit。
      # Windows 用 CMake 自带的 Visual Studio 生成器：CMake 自己就能定位 MSVC，
      # 不需要预先 vcvars，也就不需要引入第三方 action 去设置它。
      # 其余平台用 Ninja。
      #
      # Android 只多一个 -DCMAKE_TOOLCHAIN_FILE=：**平台配置是按 CMAKE_SYSTEM_NAME
      # 自动选取的**（native/platforms/Android.cmake），workflow 这边不需要、也不该
      # 再声明一遍产物名或落点（决议 #81）。用绝对路径传 toolchain file —— 相对路径
      # 在部分 CMake 版本里是相对**构建目录**解析的。
      - name: Build plugin (CMake)
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S native -B native/build/ci -G "Visual Studio 17 2022" -A x64
            cmake --build native/build/ci --config Release
          elif [[ "${{ matrix.platform }}" == "android" ]]; then
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/native/cross/android-arm64.cmake"
            cmake --build native/build/ci
          elif [[ "${{ matrix.platform }}" == "ios" ]]; then
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/native/cross/ios-arm64.cmake"
            cmake --build native/build/ci
          else
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build native/build/ci
          fi

      # audit 已在 POST_BUILD 跑过一次（那才是**门禁** —— 它跑不过，构建就失败）；
      # 这里再显式跑一次，只为在 CI 日志里成为独立可定位的一步。
      #
      # 刻意**不**在这里重复 --require-page-align：那个要求由
      # native/platforms/Android.cmake 声明、由 POST_BUILD 那次执行。在 workflow
      # 里再写一遍就是第二个真相源，而两处迟早会错开。这一步因此是门禁的**子集**，
      # 不是门禁本身。
      - name: Audit plugin (exports + dependencies)
        run: |
          python3 native/scripts/audit_plugin.py \
            --binary "${{ matrix.artifact_path }}" \
            --platform ${{ matrix.platform }} \
            --expected native/exports/expected-symbols.txt

      # 产物**与它的溯源文件一起**上传。只传二进制的话，维护者下载后手里没有
      # 溯源信息，本机补一份的话 ci=null，会被 gen_support_table.py 的门禁
      # （正确地）拒掉——于是根本无法从 CI 产物完成入库。首次尝试入库时发现。
      #
      # 两条路径的最近公共祖先自 #65 起是包根，于是 zip 里就是 Plugins/... 与
      # Report~/... 两棵子树 —— 正好是入库时该解到的形状。
      - uses: actions/upload-artifact@v6
        with:
          name: datachannel_unity-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.build_info_path }}
          if-no-files-found: error

  static-checks:
    name: Script syntax and generated files
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax
        run: |
          for s in native/scripts/*.sh; do bash -n "$s"; done

      - name: Python syntax
        run: |
          python3 -m py_compile native/scripts/*.py

      # .meta 的产生与校验是同一个机制（#52）：重跑生成器并 diff，不一致就红。
      # 不需要 Unity，所以能待在这个 job 里 —— 而 CI 里没有 Unity（#43）。
      # 它同时核对黄金样本（真 Editor 实写的字节），否则生成器自己写错时
      # 生成物与仓库永远一致、门禁永远绿。
      - name: Plugin .meta matches generator and golden samples
        run: |
          python3 native/scripts/gen_plugin_meta.py \
            --plugin-root Packages/datachannel-unity/Plugins \
            --golden native/exports/plugin-meta-golden \
            --check

      # 支持表由 git 跟踪的产物导出（#53），所以它不可能撒谎、也不可能被忘记更新。
      # 同一步还断言：每个已入库的二进制在 Report~/ 里都有一份**来自 CI** 的溯源
      # 文件（#54 立的门禁，#65 只改了它去哪找）—— 本机产的那份 ci=null，没有 run
      # URL，commit 描述的是 checkout 而不是被编译的东西，没有溯源价值。期望的
      # 文件名由二进制自己的路径算出，没有人工清单可以撒谎。
      - name: Support table is derived from the shipped binaries
        run: |
          python3 native/scripts/gen_support_table.py \
            --repo-root . \
            --plugin-root Packages/datachannel-unity/Plugins \
            --report-root "Packages/datachannel-unity/Report~" \
            --readme Packages/datachannel-unity/README.md \
            --check

# ────────────────────────────────────────────────────────────────────────────
# 这里**故意没有** Unity 测试 job（决策 #43，推翻 #39 决议 1 的门禁归属）。
#
# 判据是「要不要 Unity」：需要 Unity 的一律本机在真 Editor 里跑，不需要的才上 CI。
#
# 别把它加回来。理由不是麻烦，是那条路会主动制造坏局面：
# GitHub 不把 secrets 传给来自 fork 的 pull_request，但 vars 是可见的 ——
# 一旦上游把 ENABLE_UNITY_TESTS 设为 true，外部 PR 会启动 job、拿到空许可证、
# 变红，而贡献者自己没有任何修法。
#
# 三档 C# 测试（托管 / native EditMode / native PlayMode）的执行方式见
# docs/verification-mcp.md；门禁条文见 CONTRIBUTING.md；判据见 SPEC §11。
#
# 已知且接受的代价：没有任何自动门禁覆盖 C#，编译错误要等打开 Editor 才发现。
# ────────────────────────────────────────────────────────────────────────────
