# PR 门禁（map #20）：macOS arm64 原生构建 + audit，以及（可选的）EditMode 测试。
# 完整多平台矩阵在 plugins-matrix.yml（发版 / 定时）。
name: PR

on:
  pull_request:
  push:
    branches: [main]

# 同一分支的新推送取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-macos-arm64:
    name: macOS arm64 plugin + audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 不装 meson：构建入口是 CMake（#27 移除了 Meson —— 它不编译任何源文件，
      # 却带来「改源码不重建」与「--cross-file 零作用」两个缺陷）。
      - name: Install build tools
        run: brew install cmake ninja

      # 刻意不做 `chmod +x`。脚本的可执行位已正确记录在 git 中
      # （本仓库 core.fileMode=false，曾导致模式丢失，见 #35）。
      # 兜底 chmod 会持续掩盖同类回归 —— 这一步就是让它暴露。
      - name: Assert scripts are executable (no chmod fallback)
        run: |
          fail=0
          for s in native/scripts/*.sh native/scripts/*.py; do
            if [[ ! -x "$s" ]]; then
              echo "::error file=$s::缺少可执行位。请用 'git update-index --chmod=+x $s' 修正，不要在 CI 里 chmod。"
              fail=1
            fi
          done
          exit $fail

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      - name: Build plugin (CMake)
        run: ./native/scripts/build-macos.sh

      # audit 已在构建的 POST_BUILD 阶段跑过一次（CMake 的第二条 POST_BUILD 命令，
      # 见 native/CMakeLists.txt），这里再显式跑一次，是为了在 CI 日志里成为
      # 独立可定位的一步。
      - name: Audit plugin (symbols + no forbidden crypto dylibs)
        run: |
          python3 ./native/scripts/audit_plugin.py \
            --binary Packages/datachannel-unity/Plugins/macOS/datachannel_unity.bundle \
            --platform darwin \
            --expected native/exports/expected-symbols.txt

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: datachannel_unity-macos-arm64
          path: Packages/datachannel-unity/Plugins/macOS/datachannel_unity.bundle

  static-checks:
    name: Script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for s in native/scripts/*.sh; do bash -n "$s"; done

      - name: Python syntax
        run: |
          python3 -m py_compile native/scripts/*.py

      # .meta 的产生与校验是同一个机制（#52）：重跑生成器并 diff，不一致就红。
      # 不需要 Unity，所以能待在这个 job 里 —— 而 CI 里没有 Unity（#43）。
      # 它同时核对黄金样本（真 Editor 实写的字节），否则生成器自己写错时
      # 生成物与仓库永远一致、门禁永远绿。
      - name: Plugin .meta matches generator and golden samples
        run: |
          python3 native/scripts/gen_plugin_meta.py \
            --plugin-root Packages/datachannel-unity/Plugins \
            --golden native/exports/plugin-meta-golden \
            --check

# ────────────────────────────────────────────────────────────────────────────
# 这里**故意没有** Unity 测试 job（决策 #43，推翻 #39 决议 1 的门禁归属）。
#
# 判据是「要不要 Unity」：需要 Unity 的一律本机在真 Editor 里跑，不需要的才上 CI。
#
# 别把它加回来。理由不是麻烦，是那条路会主动制造坏局面：
# GitHub 不把 secrets 传给来自 fork 的 pull_request，但 vars 是可见的 ——
# 一旦上游把 ENABLE_UNITY_TESTS 设为 true，外部 PR 会启动 job、拿到空许可证、
# 变红，而贡献者自己没有任何修法。
#
# 三档 C# 测试（托管 / native EditMode / native PlayMode）的执行方式见
# docs/verification-mcp.md；门禁条文见 CONTRIBUTING.md；判据见 SPEC §11。
#
# 已知且接受的代价：没有任何自动门禁覆盖 C#，编译错误要等打开 Editor 才发现。
# ────────────────────────────────────────────────────────────────────────────
