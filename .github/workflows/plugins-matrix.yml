# 完整插件矩阵（map #46 / 决议 #51）：发版 / 定时 / 手动触发。
# 维护者下载 artifact 后自行提交 LFS 插件（#53/#54）—— 不自动推 main。
#
# 按**宿主**分 job，每个 job 内部用 matrix 列它负责的目标。这样同宿主共享准备
# 步骤（Xcode / apt / MSVC），一个 `if:` 都不需要；加目标 = 加一行 matrix。
#
# 不用 Docker（#51）：Xcode、MSVC 工具集、NDK 都能用 GHA 原生手段钉死；唯一钉
# 不死的是 glibc 下限，而那条已由「声明支持下限 = Ubuntu 22.04」解决。为一件事
# 扛一整套 Dockerfile 不划算。
name: Plugins matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  release:
    types: [published]

defaults:
  run:
    # Windows runner 默认 pwsh；不写这行，下面的 bash 语法会直接语法错，
    # 而语法错会让可执行位断言变成**恒假** —— 同样违反第一原则（#48）。
    shell: bash

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: darwin
            artifact_path: Packages/datachannel-unity/Plugins/macOS/datachannel_unity.dylib
            build_info_path: Packages/datachannel-unity/Plugins/macOS/build-info.json
    steps:
      - uses: actions/checkout@v4

      # 显式钉版本，不用默认 —— 托管 mac runner 拿不到「锁工具链」的等价好处
      # （Xcode 装不进 Linux 容器），用默认的话 GitHub 换镜像时产物会悄悄变。
      # 26.6 与本机开发环境同版本。
      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools
        run: brew install cmake ninja

      - name: Assert scripts are executable in git
        run: |
          fail=0
          while read -r mode _ _ file; do
            [[ "$mode" == "100755" ]] || { echo "::error file=$file::mode=$mode, expected 100755"; fail=1; }
          done < <(git ls-files -s native/scripts/)
          exit $fail

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      - name: Build plugin (CMake)
        run: |
          cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/ci

      - name: Audit plugin
        run: |
          python3 native/scripts/audit_plugin.py \
            --binary "${{ matrix.artifact_path }}" \
            --platform ${{ matrix.platform }} \
            --expected native/exports/expected-symbols.txt

      # 产物**与它的 build-info.json 一起**上传。只传二进制的话，维护者下载后
      # 手里没有溯源信息，本机补一份的话 ci=null，会被 gen_support_table.py 的
      # 门禁（正确地）拒掉——于是根本无法从 CI 产物完成入库。首次尝试入库时发现。
      - uses: actions/upload-artifact@v4
        with:
          name: datachannel_unity-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.build_info_path }}
          if-no-files-found: error

  ubuntu:
    name: ${{ matrix.name }}
    # 现存最老的 ubuntu 标签（ubuntu-20.04 已下架）。它决定本包声明的 glibc
    # 下限 = 2.35 —— 比 Unity 2022.3 声明的 Ubuntu 20.04（2.31）高一档，
    # 必须显式告知采用者（#51）。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: linux
            artifact_path: Packages/datachannel-unity/Plugins/Linux/x86_64/libdatachannel_unity.so
            build_info_path: Packages/datachannel-unity/Plugins/Linux/x86_64/build-info.json
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Assert scripts are executable in git
        run: |
          fail=0
          while read -r mode _ _ file; do
            [[ "$mode" == "100755" ]] || { echo "::error file=$file::mode=$mode, expected 100755"; fail=1; }
          done < <(git ls-files -s native/scripts/)
          exit $fail

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      - name: Build plugin (CMake)
        run: |
          cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/ci

      - name: Audit plugin
        run: |
          python3 native/scripts/audit_plugin.py \
            --binary "${{ matrix.artifact_path }}" \
            --platform ${{ matrix.platform }} \
            --expected native/exports/expected-symbols.txt

      # 产物**与它的 build-info.json 一起**上传。只传二进制的话，维护者下载后
      # 手里没有溯源信息，本机补一份的话 ci=null，会被 gen_support_table.py 的
      # 门禁（正确地）拒掉——于是根本无法从 CI 产物完成入库。首次尝试入库时发现。
      - uses: actions/upload-artifact@v4
        with:
          name: datachannel_unity-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.build_info_path }}
          if-no-files-found: error

  windows:
    name: ${{ matrix.name }}
    # 钉 windows-2022 而不是 windows-latest：后者现已指向 Windows Server 2025 +
    # **VS 2026**，"Visual Studio 17 2022" 匹配不上（实测报 could not find any
    # instance of Visual Studio）。MSVC 工具集版本决定插件链接的 CRT，不该跟着
    # 镜像漂 —— 与 Xcode 钉 26.6 同一个思路（#51）。
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            artifact_path: Packages/datachannel-unity/Plugins/Windows/x86_64/datachannel_unity.dll
            build_info_path: Packages/datachannel-unity/Plugins/Windows/x86_64/build-info.json
    steps:
      - uses: actions/checkout@v4

      - name: Assert scripts are executable in git
        run: |
          fail=0
          while read -r mode _ _ file; do
            [[ "$mode" == "100755" ]] || { echo "::error file=$file::mode=$mode, expected 100755"; fail=1; }
          done < <(git ls-files -s native/scripts/)
          exit $fail

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      # 用 CMake 自带的 Visual Studio 生成器：CMake 自己就能定位 MSVC，不需要预先
      # vcvars，也就不需要为此引入第三方 action。多配置生成器，所以 --config Release。
      - name: Build plugin (CMake)
        run: |
          cmake -S native -B native/build/ci -G "Visual Studio 17 2022" -A x64
          cmake --build native/build/ci --config Release

      - name: Audit plugin
        run: |
          python3 native/scripts/audit_plugin.py \
            --binary "${{ matrix.artifact_path }}" \
            --platform ${{ matrix.platform }} \
            --expected native/exports/expected-symbols.txt

      # 产物**与它的 build-info.json 一起**上传。只传二进制的话，维护者下载后
      # 手里没有溯源信息，本机补一份的话 ci=null，会被 gen_support_table.py 的
      # 门禁（正确地）拒掉——于是根本无法从 CI 产物完成入库。首次尝试入库时发现。
      - uses: actions/upload-artifact@v4
        with:
          name: datachannel_unity-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.build_info_path }}
          if-no-files-found: error

# ────────────────────────────────────────────────────────────────────────────
# 移动两平台**尚未启用**，各自卡在一件具体的事上。把原因写清楚而不是留一行
# 乐观的注释，是因为「骨架里列着但从没跑过」正是这个仓库已经吃过亏的形状 ——
# windows-exports.def 就是那样烂掉的（带着四个已删符号，缺六个现存符号）。
#
# **iOS arm64** —— 加一行 matrix 不够，`native/` 先要改：
#   - `add_library(datachannel_unity SHARED ...)` 是硬编码的，iOS 要 STATIC
#   - staging 按 `if(APPLE)` 判断，会给静态库造一个 .bundle
#   - 静态 .a 没有导出表，符号收窄要走 `ld -r -exported_symbols_list`（#47 实测
#     通过；注意它**只能降级不能提升**，白名单必须恰好等于 DCU_API 那一组）
#   - audit 的静态库分支尚未实现；依赖检查在 .a 上不建，缺口写进 SPEC（#50）
#
# **Android arm64-v8a** —— 有一个**尚未拍板**的问题，现在启用等于静默替人决定：
#   - 两个下界打架：Unity 2022.3 最低 API 22，而 libjuice 的 getifaddrs 需 API 24
#   - runner 默认 NDK 27.3 需显式加 16 KB page 对齐 flags（Play 自 2025-11-01
#     起要求，官方点名 prebuilt 也要重编）
#   toolchain 形状：
#     -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
#     -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-<未定>
#
# **Windows ARM64 已出图**：2022.3 的 Standalone Windows 没有 ARM64 槽位（编辑器
# 源码显式返回空路径，Unity 6000.0 才改成多架构）。产出它等于产出一个装不进任何
# Player 的二进制。
#
# **WebGL 也出图**：它不是多一个 toolchain —— 需要 datachannel-wasm 的 C facade，
# 且接收缓冲策略在 SPEC §16 明确未决，§8 更写明背压保证在它上面物理不成立。
# ────────────────────────────────────────────────────────────────────────────
