# 完整插件矩阵（map #46 / 决议 #51）：发版 / 定时 / 手动触发。
# 维护者下载 artifact 后自行提交 LFS 插件（#53/#54）—— 不自动推 main。
#
# 按**宿主**分 job，每个 job 内部用 matrix 列它负责的目标。这样同宿主共享准备
# 步骤（Xcode / apt / MSVC），一个 `if:` 都不需要；加目标 = 加一行 matrix。
#
# 不用 Docker（#51）：Xcode、MSVC 工具集、NDK 都能用 GHA 原生手段钉死；唯一钉
# 不死的是 glibc 下限，而那条已由「声明支持下限 = Ubuntu 22.04」解决。为一件事
# 扛一整套 Dockerfile 不划算。
name: Plugins matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  release:
    types: [published]

defaults:
  run:
    # Windows runner 默认 pwsh；不写这行，下面的 bash 语法会直接语法错，
    # 而语法错会让可执行位断言变成**恒假** —— 同样违反第一原则（#48）。
    shell: bash

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: darwin
            artifact_path: Packages/datachannel-unity/Plugins/macOS/datachannel_unity.dylib
            build_info_path: Packages/datachannel-unity/Report~/macOS.json
          - name: iOS arm64
            platform: ios
            artifact_path: Packages/datachannel-unity/Plugins/iOS/libdatachannel_unity.a
            build_info_path: Packages/datachannel-unity/Report~/iOS.json
    steps:
      - uses: actions/checkout@v5

      # 显式钉版本，不用默认 —— 托管 mac runner 拿不到「锁工具链」的等价好处
      # （Xcode 装不进 Linux 容器），用默认的话 GitHub 换镜像时产物会悄悄变。
      # 26.6 与本机开发环境同版本。
      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install build tools
        run: brew install cmake ninja

      - name: Assert scripts are executable in git
        run: |
          fail=0
          while read -r mode _ _ file; do
            [[ "$mode" == "100755" ]] || { echo "::error file=$file::mode=$mode, expected 100755"; fail=1; }
          done < <(git ls-files -s native/scripts/)
          exit $fail

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      # 交叉编译目标只多一个 -DCMAKE_TOOLCHAIN_FILE=。平台配置按 CMAKE_SYSTEM_NAME
      # 自动选取，这里不再声明产物名或落点（决议 #81）。
      - name: Build plugin (CMake)
        run: |
          if [[ "${{ matrix.platform }}" == "android" ]]; then
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/native/cross/android-arm64.cmake"
          elif [[ "${{ matrix.platform }}" == "ios" ]]; then
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/native/cross/ios-arm64.cmake"
          else
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build native/build/ci

      # 与 pr.yml 同：页对齐要求由平台文件声明、由 POST_BUILD 那次 audit 执行，
      # 这里不重复 --require-page-align，避免第二个真相源。这一步是门禁的子集。
      - name: Audit plugin
        run: |
          python3 native/scripts/audit_plugin.py \
            --binary "${{ matrix.artifact_path }}" \
            --platform ${{ matrix.platform }} \
            --expected native/exports/expected-symbols.txt

      # 产物**与它的溯源文件一起**上传。只传二进制的话，维护者下载后手里没有
      # 溯源信息，本机补一份的话 ci=null，会被 gen_support_table.py 的门禁
      # （正确地）拒掉——于是根本无法从 CI 产物完成入库。首次尝试入库时发现。
      #
      # 两条路径的最近公共祖先自 #65 起是包根，于是 zip 里就是 Plugins/... 与
      # Report~/... 两棵子树 —— 正好是入库时该解到的形状。
      - uses: actions/upload-artifact@v6
        with:
          name: datachannel_unity-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.build_info_path }}
          if-no-files-found: error

  ubuntu:
    name: ${{ matrix.name }}
    # 现存最老的 ubuntu 标签（ubuntu-20.04 已下架）。它决定本包声明的 glibc
    # 下限 = 2.35 —— 比 Unity 2022.3 声明的 Ubuntu 20.04（2.31）高一档，
    # 必须显式告知采用者（#51）。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: linux
            artifact_path: Packages/datachannel-unity/Plugins/Linux/x86_64/libdatachannel_unity.so
            build_info_path: Packages/datachannel-unity/Report~/Linux-x86_64.json
          - name: Android arm64-v8a
            platform: android
            artifact_path: Packages/datachannel-unity/Plugins/Android/arm64-v8a/libdatachannel_unity.so
            build_info_path: Packages/datachannel-unity/Report~/Android-arm64-v8a.json
    steps:
      - uses: actions/checkout@v5

      # 只从 Ubuntu 官方源更新索引，理由与 pr.yml 同一处注释：镜像预置的第三方源
      # （microsoft / chrome）挂掉会让 apt-get update 整体 exit 100，而我们一个包
      # 都不从那里取。v0.1.0 的 release 跑就是这么红的。不写 `|| true`。
      - name: Install build tools
        run: |
          sudo apt-get update -o Dir::Etc::sourceparts=/dev/null
          sudo apt-get install -y cmake ninja-build

      - name: Assert scripts are executable in git
        run: |
          fail=0
          while read -r mode _ _ file; do
            [[ "$mode" == "100755" ]] || { echo "::error file=$file::mode=$mode, expected 100755"; fail=1; }
          done < <(git ls-files -s native/scripts/)
          exit $fail

      # Android 与 Linux 共用 Ubuntu host，但只有 Android 是交叉编译：NDK r27
      # 必须在这个 job 钉住并把 toolchain file 传给 configure。此前这段误放在 macOS job，
      # 该条件永远不成立，导致 Android matrix 行实际构出了 Linux 插件，随后 audit 正确地
      # 在预期的 Android 路径找不到产物而失败。
      - name: Pin Android NDK (r27, highest minor)
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          ndk_root=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -1 || true)
          if [[ -z "$ndk_root" || ! -d "$ndk_root" ]]; then
            echo "::error::No NDK 27.* under $ANDROID_SDK_ROOT/ndk (decision #79 pins the r27 major)"
            ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "(no ndk directory at all)"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"
          echo "Pinned NDK: $ndk_root"

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      - name: Build plugin (CMake)
        run: |
          if [[ "${{ matrix.platform }}" == "android" ]]; then
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/native/cross/android-arm64.cmake"
          else
            cmake -S native -B native/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build native/build/ci

      - name: Audit plugin
        run: |
          python3 native/scripts/audit_plugin.py \
            --binary "${{ matrix.artifact_path }}" \
            --platform ${{ matrix.platform }} \
            --expected native/exports/expected-symbols.txt

      # 产物**与它的溯源文件一起**上传。只传二进制的话，维护者下载后手里没有
      # 溯源信息，本机补一份的话 ci=null，会被 gen_support_table.py 的门禁
      # （正确地）拒掉——于是根本无法从 CI 产物完成入库。首次尝试入库时发现。
      #
      # 两条路径的最近公共祖先自 #65 起是包根，于是 zip 里就是 Plugins/... 与
      # Report~/... 两棵子树 —— 正好是入库时该解到的形状。
      - uses: actions/upload-artifact@v6
        with:
          name: datachannel_unity-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.build_info_path }}
          if-no-files-found: error

  windows:
    name: ${{ matrix.name }}
    # 钉 windows-2022 而不是 windows-latest：后者现已指向 Windows Server 2025 +
    # **VS 2026**，"Visual Studio 17 2022" 匹配不上（实测报 could not find any
    # instance of Visual Studio）。MSVC 工具集版本决定插件链接的 CRT，不该跟着
    # 镜像漂 —— 与 Xcode 钉 26.6 同一个思路（#51）。
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            artifact_path: Packages/datachannel-unity/Plugins/Windows/x86_64/datachannel_unity.dll
            build_info_path: Packages/datachannel-unity/Report~/Windows-x86_64.json
    steps:
      - uses: actions/checkout@v5

      - name: Assert scripts are executable in git
        run: |
          fail=0
          while read -r mode _ _ file; do
            [[ "$mode" == "100755" ]] || { echo "::error file=$file::mode=$mode, expected 100755"; fail=1; }
          done < <(git ls-files -s native/scripts/)
          exit $fail

      - name: Fetch pinned upstream deps
        run: ./native/scripts/fetch-deps.sh

      # 用 CMake 自带的 Visual Studio 生成器：CMake 自己就能定位 MSVC，不需要预先
      # vcvars，也就不需要为此引入第三方 action。多配置生成器，所以 --config Release。
      - name: Build plugin (CMake)
        run: |
          cmake -S native -B native/build/ci -G "Visual Studio 17 2022" -A x64
          cmake --build native/build/ci --config Release

      - name: Audit plugin
        run: |
          python3 native/scripts/audit_plugin.py \
            --binary "${{ matrix.artifact_path }}" \
            --platform ${{ matrix.platform }} \
            --expected native/exports/expected-symbols.txt

      # 产物**与它的溯源文件一起**上传。只传二进制的话，维护者下载后手里没有
      # 溯源信息，本机补一份的话 ci=null，会被 gen_support_table.py 的门禁
      # （正确地）拒掉——于是根本无法从 CI 产物完成入库。首次尝试入库时发现。
      #
      # 两条路径的最近公共祖先自 #65 起是包根，于是 zip 里就是 Plugins/... 与
      # Report~/... 两棵子树 —— 正好是入库时该解到的形状。
      - uses: actions/upload-artifact@v6
        with:
          name: datachannel_unity-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.build_info_path }}
          if-no-files-found: error

# ────────────────────────────────────────────────────────────────────────────
# **Windows ARM64 已出图**：2022.3 的 Standalone Windows 没有 ARM64 槽位（编辑器
# 源码显式返回空路径，Unity 6000.0 才改成多架构）。产出它等于产出一个装不进任何
# Player 的二进制。
#
# **WebGL 也出图**：它不是多一个 toolchain —— 需要 datachannel-wasm 的 C facade，
# 且接收缓冲策略在 SPEC §16 明确未决，§8 更写明背压保证在它上面物理不成立。
# ────────────────────────────────────────────────────────────────────────────
