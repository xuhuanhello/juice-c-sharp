# coturn —— datachannel-unity FishNet 示例的中继/STUN 服务器
#
# 决议：https://github.com/xuhuanhello/juice-c-sharp/issues/117
#
# 本文件**只放非密钥项**，因此可以入库。
# TURN secret 由 docker-compose.yml 经命令行参数从 .env 注入：
#     command: ["--static-auth-secret=${TURN_SECRET}", ...]
# 命令行参数覆盖本文件的同名项（已在本机 coturn 容器实测，见 #122）。

# --- 认证：时限 HMAC（#117 决议）-----------------------------------------
# 只开 use-auth-secret，不要同时开 lt-cred-mech ——
# 后者是静态凭据机制，两个都开会让「哪一套在生效」变得不明显。
use-auth-secret

# realm 必填。HMAC 模式下它不参与签名，但 STUN 长期认证的挑战里要带它。
# 换成你自己的域名。
realm=turn.example.org

# --- 监听 ---------------------------------------------------------------
listening-port=3478

# relay 分配用的 UDP 端口段。
# 段开小一点是有意的：docker 逐个映射端口不现实，所以 compose 用
# network_mode: host（Linux VPS 可用）。这段要在 VPS 防火墙/安全组里放行。
min-port=49160
max-port=49200

# --- 云主机必填 ---------------------------------------------------------
# **不填这条是最常见的翻车点。** 云主机（EC2 / 轻量应用服务器 / 大多数 VPS）
# 的网卡上是私网地址，coturn 会把私网地址当 relay 候选发出去，对端永远连不上。
# 填你的公网 IP；有弹性公网 IP 的填那个。
# external-ip=203.0.113.10

# --- 关掉不用的 ---------------------------------------------------------
# 不上 TLS（#117 决议：password 本就不上线、载荷 DTLS 端到端加密，
# TURNS 只买「隐藏在用 TURN」与穿 443）。将来要开就删掉这两行、配证书、
# 并把 iceServers 里的 URL 换成 turns:。
no-tls
no-dtls

# 不开 telnet CLI —— 它默认只听 127.0.0.1，但容器里没有必要留。
no-cli

# 关掉多播/回环等无意义的中继目标，减少被当开放中继滥用的面。
no-multicast-peers

# --- 日志 ---------------------------------------------------------------
# 输出到 stdout，交给 docker logs。不写文件，免得容器里攒日志。
log-file=stdout
simple-log

# 想看每个 allocation 的细节时临时打开（很啰嗦，别常开）。
# verbose
